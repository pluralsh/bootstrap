apiVersion: v2
name: runtime
description: Sets up the basic dependencies needed to get a network stack running
type: application
version: 1.0.0
appVersion: "0.1.0"
dependencies:
- name: external-dns
  version: 8.3.8
  repository: oci://registry-1.docker.io/bitnamicharts
  condition: external-dns.enabled
- name: cert-manager
  version: v1.13.6
  repository: https://charts.jetstack.io
  condition: cert-manager.enabled
- name: plural-certmanager-webhook
  version: 0.1.7
  condition: plural-certmanager-webhook.enabled
- name: traefik
  version: 42.1.3
  repository: https://traefik.github.io/charts
  condition: traefik.enabled
- name: traefik
  version: 42.1.3
  repository: https://traefik.github.io/charts
  alias: traefik-private
  condition: traefik-private.enabled
- name: flux2
  repository: https://fluxcd-community.github.io/helm-charts
  version: 2.12.4
  condition: flux2.enabled
