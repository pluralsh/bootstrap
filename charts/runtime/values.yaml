enableLetsEncrypt: true

external-dns:
  enabled: true
  provider: plural
  fullnameOverride: runtime-externaldns
  image:
    repository: bitnamilegacy/external-dns
  rbac:
    create: true
    serviceAccountName: external-dns
  sources:
  - service
  - ingress
  serviceAccount:
    name: external-dns
    create: true
  txtOwnerId: plural
  policy: upsert-only
  extraEnvVars:
  - name: PLURAL_ACCESS_TOKEN
    valueFrom:
      secretKeyRef:
        name: plural-env
        key: PLURAL_ACCESS_TOKEN

plural-certmanager-webhook:
  enabled: true
  certManager:
    namespace: cert-manager
    serviceAccountName: cert-manager

operator:
  enabled: true

application:
  enabled: false
  registry: dkr.plural.sh/bootstrap
  tag: v0.8.3

plural:
  enabled: true
  image:
    repository: dkr.plural.sh/bootstrap/plural-operator
    tag: 0.5.5

ownerEmail: someone@example.com
acmeServer: https://acme.zerossl.com/v2/DV90
letsencryptServer: https://acme-v02.api.letsencrypt.org/directory

dnsSolver:
  webhook:
    groupName: acme.plural.sh
    solverName: plural-solver

acmeEAB: {}

certManagerNamespace: cert-manager

cert-manager:
  enabled: false
  installCRDs: true
  serviceAccount:
    name: cert-manager
  securityContext:
    fsGroup: 1000
    runAsNonRoot: true

# Traefik serves the `internal-nginx` ingress class through its ingress-nginx compatible provider,
# so Ingresses written for the previous ingress-nginx controller keep working unchanged.
traefik-private:
  enabled: true
  deployment:
    replicas: null # owned by the HPA
    terminationGracePeriodSeconds: 300
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingressClass:
    enabled: false
  providers:
    kubernetesCRD:
      enabled: false
    kubernetesIngress:
      enabled: false
    kubernetesIngressNGINX:
      enabled: true
      ingressClass: internal-nginx
      controllerClass: k8s.io/internal-ingress-nginx
      publishService:
        enabled: true
      proxyReadTimeout: 3600
      proxySendTimeout: 3600
  # unlimited request body like ingress-nginx proxy-body-size 0, the chart drops falsy provider values
  additionalArguments:
  - --providers.kubernetesingressnginx.proxyBodySize=0
  extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: IngressClass
    metadata:
      name: internal-nginx
    spec:
      controller: k8s.io/internal-ingress-nginx
  ports:
    web:
      transport:
        respondingTimeouts:
          readTimeout: 0
          writeTimeout: 0
          idleTimeout: 3600s
        lifeCycle:
          graceTimeOut: 240s
    websecure:
      transport:
        respondingTimeouts:
          readTimeout: 0
          writeTimeout: 0
          idleTimeout: 3600s
        lifeCycle:
          graceTimeOut: 240s
  service:
    annotations:
      networking.gke.io/load-balancer-type: "Internal"
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
      service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: '3600'
  log:
    format: json
  accessLog:
    enabled: true
    format: json
  metrics:
    prometheus:
      service:
        enabled: true
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9100"
          prometheus.io/path: "/metrics"
          prometheus.io/scheme: http
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ template "traefik.name" . }}'
        app.kubernetes.io/instance: '{{ template "traefik.instance-name" . }}'
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 11
    metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 95
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Pods
          value: 1
          periodSeconds: 180
      scaleUp:
        stabilizationWindowSeconds: 300
        policies:
        - type: Pods
          value: 2
          periodSeconds: 60

