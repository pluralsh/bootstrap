[[- if or (eq .Provider "aws") (eq .Provider "gcp") (eq .Provider "azure") ]]
# The devbox node pool's disk prep and the DevboxRunner the deployment operator turns into Substrate workers and
# console devboxes. On AWS the node pool is a Karpenter NodePool here; elsewhere it's in the mgmt stack
# (terraform/mgmt/cluster/devbox.tf).
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: devbox-nodes
  namespace: infra
spec:
  name: devbox-nodes
  namespace: devbox-nodes
  git:
    folder: services/devbox
    ref: [[ or .Context.Branch "main" ]]
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  dependencies:
  # the DevboxRunner needs Substrate's WorkerPool API
  - name: agent-substrate
  [[- if eq .Provider "aws" ]]
  # the NodePool and EC2NodeClass need Karpenter's CRDs
  - name: karpenter
  imports:
  - stackRef:
      name: mgmt
      namespace: infra
  [[- end ]]
  configuration:
    cloud: [[ .Provider ]]
    pool: devbox
    diskPrepImage: ghcr.io/pluralsh/agent-harness-base:0.6.76
    [[- if eq .Provider "aws" ]]
    # the gp3 data volume at /dev/xvdb; elsewhere /var/lib/ate stays on the boot disk and disk prep only lifts the
    # startup taint (console rejects an empty configuration value, so diskModel is left out)
    diskModel: "Elastic Block Store"
    dataDiskSize: 200Gi
    # one type, since gVisor snapshots need a single CPU model; it must support nested virtualization
    instanceType: m7i.2xlarge
    # caps the pool at 5 of those nodes
    maxCpu: "40"
    [[- end ]]
    # every pool's default machine has 8 vCPUs and 32GiB, so one worker per node fits below its allocatable resources
    workerCpu: "7"
    workerMemory: 24Gi
    diskSize: 200Gi
    maxWorkers: "5"
  clusterRef:
    kind: Cluster
    name: mgmt
    namespace: infra
[[- end ]]
