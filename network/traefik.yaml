apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: traefik
  namespace: infra
spec:
  mgmt: false
  template:
    namespace: traefik
    git:
      ref: main
      folder: helm
    repositoryRef:
      name: infra # if you check in `bootstrap/setup.yaml` you should find the custom resource this points to
      namespace: infra
    helm:
      version: 42.x.x
      chart: traefik
      url: https://traefik.github.io/charts
      valuesFiles:
      - traefik.yaml.liquid
